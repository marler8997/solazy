name: ci
on: [pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      matrix:
        os:
          - windows-latest
          - windows-11-arm
          - macos-latest
          - ubuntu-latest
          - ubuntu-24.04-arm
      fail-fast: false
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v7
      - uses: marler8997/setup-anyzig@master
      - run: zig build test --summary all
